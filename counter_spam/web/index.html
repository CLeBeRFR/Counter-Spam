<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Counter-Spam</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="/icon.svg" alt="" width="40" height="40">
      <div>
        <h1>Counter-Spam</h1>
        <p class="account" id="account">Signing in…</p>
      </div>
    </div>
    <button type="button" class="ghost" id="quit">Quit</button>
  </header>

  <main>
    <section class="panel" id="controls" aria-labelledby="controls-title">
      <h2 id="controls-title">1. Analyze the Junk folder</h2>
      <div class="row">
        <label>Messages
          <input type="number" id="limit" min="1" max="500" value="50">
        </label>
        <label class="check">
          <input type="checkbox" id="links" checked>
          Also report the websites advertised in the spam
        </label>
        <button type="button" id="analyse">Analyze</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <progress id="progress" max="1" value="0" hidden></progress>
    </section>

    <section class="panel" id="plan" hidden aria-labelledby="plan-title">
      <h2 id="plan-title">2. Review the reports</h2>
      <p class="summary" id="summary"></p>
      <div id="groups"></div>
    </section>

    <section class="panel" id="sending" hidden aria-labelledby="send-title">
      <h2 id="send-title">3. Send</h2>
      <label class="block">Personal note added at the top of every
        report (optional)
        <textarea id="note" rows="3" maxlength="5000"></textarea>
      </label>
      <label class="check">
        <input type="checkbox" id="delete">
        Then move the reported spam to Deleted Items
      </label>
      <div class="row">
        <button type="button" class="primary" id="send">Send</button>
      </div>
      <div class="send-progress" id="send-progress" hidden>
        <progress id="send-bar" max="1" value="0"
                  aria-labelledby="send-status"></progress>
        <p id="send-status" role="status" aria-live="polite"></p>
      </div>
      <ul class="results" id="results"></ul>
    </section>
  </main>
</body>
</html>
